# Publishes the repo to GitHub Pages ourselves, instead of relying on the
# built-in "pages build and deployment" workflow.
#
# Why: that workflow is generated by GitHub and cannot be configured. It runs one
# deployment at a time and REJECTS overlapping ones, so three pushes in seven
# minutes on 2026-08-06 wedged it in `deployment_queued` — the run could not be
# cancelled, re-run, or cleared by deleting the environment, and the site sat five
# versions behind for hours.
#
# The `concurrency` block below is the fix: a new push CANCELS the in-flight
# deployment instead of queueing behind it, so the collision cannot happen again.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # a manual "Run workflow" button, for when a run needs retrying

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: true switches the repo's Pages source to "GitHub Actions"
      # on its own, so this does not need a settings change to take effect.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
