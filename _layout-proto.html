<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDL Parser — layout prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090b;
    --panel: #101216;
    --raised: #171b21;
    --sunken: #0a0c0f;
    --line: #232830;
    --text: #eceff3;
    --muted: #9aa3af;
    --faint: #6b7380;
    --accent: #4c8dff;
    --accent-2: #7eb0ff;
    --ok: #3ecf8e;
    --warn: #d9a441;
    --err: #ef6b73;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  button, input { font: inherit; }
  button { cursor: pointer; }

  .stage {
    display: flex; align-items: center; gap: 14px;
    height: 42px; padding: 0 16px; flex-shrink: 0;
    background: #0c0e12; border-bottom: 1px solid var(--line);
  }
  .stage kbd {
    font: 10px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase;
    color: var(--faint);
  }
  .scenes { display: flex; gap: 2px; background: var(--sunken); padding: 3px; border-radius: 8px; border: 1px solid var(--line); }
  .scenes button {
    border: 0; background: transparent; color: var(--muted);
    padding: 5px 12px; border-radius: 6px;
  }
  .scenes button.on { background: var(--raised); color: var(--text); }
  .stage .hint { margin-left: auto; color: var(--faint); font-size: 12px; }

  #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .top {
    height: 44px; display: flex; align-items: center; gap: 14px;
    padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-shrink: 0;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand strong { font-size: 14px; font-weight: 600; letter-spacing: -.02em; }
  .brand em { font-style: normal; color: var(--faint); font-size: 12px; }
  .sp { flex: 1; }
  .btn {
    height: 26px; padding: 0 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--raised); color: var(--muted);
  }
  .btn:hover { color: var(--text); border-color: #323844; }
  .btn.pri { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; }
  .btn.ghost { background: transparent; }
  .ico {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--raised); color: var(--muted); display: grid; place-items: center;
  }

  .ws { flex: 1; min-height: 0; display: grid; gap: 1px; background: var(--line); }
  .ws.run { grid-template: 1fr auto / 1.15fr 1fr; }
  .ws.done { grid-template: 1fr 1.1fr / 1.1fr .9fr; }
  .pane { background: var(--panel); min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .hd {
    height: 34px; display: flex; align-items: center; gap: 8px;
    padding: 0 10px; background: var(--raised); border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .hd b { font-size: 12px; font-weight: 600; }
  .find {
    height: 22px; width: 132px; padding: 0 8px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--sunken); color: var(--faint); font-size: 11px;
  }
  .cols { display: flex; flex: 1; min-height: 0; }
  .tree { width: 176px; border-right: 1px solid var(--line); padding: 8px; background: var(--sunken); }
  .n { padding: 5px 8px; border-radius: 5px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
  .n.on { background: rgba(76,141,255,.12); color: var(--text); }
  .n small { color: var(--faint); }
  .code, .paste {
    flex: 1; margin: 0; padding: 14px 16px; overflow: auto;
    font: 12px/1.65 var(--mono); color: #b7c0cc; white-space: pre;
  }
  .c-kw { color: #7eb6ff; } .c-ty { color: #c3a6ff; } .c-num { color: #e0b56a; }

  .launch {
    grid-column: 1 / -1; background: var(--panel);
    padding: 16px 20px 18px; display: grid; grid-template-columns: 1fr auto; gap: 14px 24px; align-items: center;
  }
  .launch h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
  .launch p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
  .gaps { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-radius: 8px; cursor: pointer;
    background: #1c170c; border: 1px solid #3d3318; color: var(--text);
  }
  .chip:hover { border-color: var(--warn); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }

  .bar {
    display: flex; align-items: center; gap: 10px; padding: 6px 12px;
    font: 11px var(--mono); color: var(--muted); background: var(--sunken); border-bottom: 1px solid var(--line);
  }
  .bar u { text-decoration: none; color: var(--accent-2); }
  .issues {
    display: flex; align-items: center; gap: 10px; padding: 7px 12px;
    background: #2a1214; border-bottom: 1px solid #5a2226; color: #ffb4b8; font-size: 12px;
  }
  table.g { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
  table.g th {
    text-align: left; font: 10px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase;
    color: var(--faint); padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--raised);
  }
  table.g td { padding: 7px 12px; border-bottom: 1px solid var(--line); }
  table.g tr.bad td { background: #2a1214; color: #ffb4b8; }
  table.g tr:hover td { background: #161a20; }
  .hex { padding: 14px 16px; font: 11px/1.8 var(--mono); color: var(--muted); }
  .hex em { font-style: normal; color: var(--accent-2); }

  .set { flex: 1; display: grid; grid-template-columns: 220px 1fr; min-height: 0; background: var(--line); gap: 1px; }
  .nav { background: var(--panel); padding: 14px 10px; }
  .nav button {
    width: 100%; text-align: left; border: 0; background: transparent;
    color: var(--muted); padding: 9px 12px; border-radius: 7px;
  }
  .nav button.on { background: rgba(76,141,255,.12); color: var(--text); }
  .set-main { background: var(--panel); padding: 28px 36px; overflow: auto; }
  .set-main h2 { margin: 0 0 6px; font-size: 20px; font-weight: 600; letter-spacing: -.03em; }
  .set-main .lead { margin: 0 0 22px; color: var(--muted); max-width: 48ch; }
  .card {
    max-width: 680px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--sunken); margin-bottom: 8px; padding: 12px 14px;
    display: flex; align-items: center; gap: 14px; cursor: pointer;
  }
  .card:hover { border-color: #343b48; }
  .card b { min-width: 168px; }
  .ok { color: var(--ok); font-size: 12px; }
  .no { color: var(--warn); font-size: 12px; }
  .pref { display: flex; justify-content: space-between; align-items: center; max-width: 480px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .seg { display: flex; background: var(--sunken); border: 1px solid var(--line); border-radius: 7px; padding: 2px; }
  .seg i { font-style: normal; padding: 4px 11px; border-radius: 5px; color: var(--muted); }
  .seg i.on { background: var(--raised); color: var(--text); }

  .de { flex: 1; display: grid; grid-template-columns: 208px minmax(0,1.4fr) minmax(300px,.95fr); min-height: 0; background: var(--line); gap: 1px; }
  .col { background: var(--panel); min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow: auto; }
  .sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sec h3 {
    margin: 0 0 10px; font-size: 10px; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
  }
  .ids { display: grid; grid-template-columns: 72px 1fr 88px 72px; gap: 8px; }
  .fld { background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
  .fld label { display: block; font-size: 10px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 3px; }
  .fld span { font: 12px var(--mono); }
  .sw { width: 12px; height: 12px; border-radius: 3px; background: #2dd4bf; display: inline-block; vertical-align: -1px; margin-right: 6px; }
  .rr {
    display: grid; grid-template-columns: 88px 1fr auto; gap: 8px; align-items: center;
    padding: 7px 8px; border-radius: 6px; background: var(--sunken); border: 1px solid var(--line); margin-bottom: 6px;
    font: 12px var(--mono); color: var(--muted);
  }
  .tag {
    font: 10px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent-2); background: rgba(76,141,255,.12); padding: 4px 6px; border-radius: 4px; text-align: center;
  }
  .gap {
    border: 1px dashed #5a4a1c; background: #1a160c; color: #e6c36a;
    border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.45;
  }
  .gap strong { color: var(--text); font-weight: 600; }
  .cm {
    display: grid; grid-template-columns: 36px 1fr; font: 12px/1.7 var(--mono);
    background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  }
  .ln { padding: 10px 0; text-align: right; color: #3d4552; background: #0d1014; user-select: none; }
  .ln div { padding-right: 10px; }
  .src { padding: 10px 12px; color: #c5cdd8; }
  .ed { background: var(--sunken); }
  .ed .hd { background: #14181e; }
  .in {
    height: 92px; border-top: 1px solid var(--line); padding: 10px 12px;
    font: 12px/1.5 var(--mono); color: var(--muted); background: #0b0d11;
  }
  .ent { padding: 8px 10px; border-radius: 7px; color: var(--muted); cursor: pointer; }
  .ent.on { background: rgba(76,141,255,.12); color: var(--text); }
  .ent .why { display: block; color: var(--warn); font-size: 11px; margin-top: 2px; }
  .grp { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 10px 10px 4px; }
</style>
</head>
<body>
<div class="stage">
  <kbd>Prototype</kbd>
  <div class="scenes">
    <button class="on" data-scene="first">First run</button>
    <button data-scene="parsed">After parse</button>
    <button data-scene="settings">Settings</button>
    <button data-scene="editor">Data Editor</button>
  </div>
  <div class="hint">Click the scenes — same information as the app, tighter layout</div>
</div>
<div id="app"></div>
<script>
const scenes = {
first: () => `
  <div class="top">
    <div class="brand"><strong>DDL Parser</strong><em>NonStop · Base24 · ISO 8583</em></div>
    <div class="sp"></div>
    <button class="ico" onclick="show('settings')">⚙</button>
  </div>
  <div class="ws run">
    <div class="pane">
      <div class="hd">
        <b>DDL</b>
        <input class="find" placeholder="Filter tree" readonly>
        <input class="find" placeholder="Find in DDL" readonly>
        <div class="sp"></div>
        <button class="btn">Save</button>
        <button class="btn">Doc</button>
      </div>
      <div class="cols">
        <div class="tree">
          <div class="n">ATM <small>0</small></div>
          <div class="n">BASE <small>0</small></div>
          <div class="n">FILES <small>0</small></div>
          <div class="n">POS <small>0</small></div>
          <div class="n on">SWITCH <small>1</small></div>
        </div>
        <pre class="code"><span class="c-kw">DEF</span> ISO-8583.
  02 MTI         <span class="c-ty">PIC X</span>(<span class="c-num">4</span>).
  02 PRI-BIT-MAP <span class="c-ty">PIC X</span>(<span class="c-num">16</span>).
  02 PAN         <span class="c-ty">PIC X</span>(<span class="c-num">19</span>).
<span class="c-kw">END</span>.</pre>
      </div>
    </div>
    <div class="pane">
      <div class="hd">
        <b>Message</b>
        <div class="sp"></div>
        <button class="btn">Audit</button>
        <button class="btn pri" onclick="show('parsed')">Parse</button>
      </div>
      <div class="paste" style="color:var(--faint)">Paste hex, NETARD, FUP COPY, or ASCII.

The field does not lock after Parse. Edit in place, or Clear.</div>
    </div>
    <div class="launch">
      <div>
        <h2>Paste a message, then Parse.</h2>
        <p>Detection chooses the type. You do not load a DDL first. Types that cannot parse yet are listed here — click one to bind it.</p>
      </div>
      <div class="gaps">
        <button class="chip" onclick="show('editor')"><span class="dot"></span> PSTM — no DDL bound</button>
        <button class="chip" onclick="show('editor')"><span class="dot"></span> Base24 POS — no parse spec</button>
        <button class="chip" onclick="show('editor')"><span class="dot"></span> NDC — no recognizer</button>
      </div>
    </div>
  </div>
`,

parsed: () => `
  <div class="top">
    <div class="brand"><strong>DDL Parser</strong><em>ISO 8583 Standard · 1 of 1</em></div>
    <div class="sp"></div>
    <button class="ico" onclick="show('settings')">⚙</button>
  </div>
  <div class="ws done">
    <div class="pane">
      <div class="hd"><b>DDL</b><div class="sp"></div><button class="btn">Doc</button></div>
      <div class="cols">
        <div class="tree"><div class="n on">SWITCH / 1987 / Standard ISO</div></div>
        <pre class="code"><span class="c-kw">DEF</span> ISO-8583.
  02 MTI  <span class="c-ty">PIC X</span>(<span class="c-num">4</span>).
  02 BMP  <span class="c-ty">BINARY</span> <span class="c-num">64</span>.
  …</pre>
      </div>
    </div>
    <div class="pane">
      <div class="hd">
        <b>Message</b><div class="sp"></div>
        <button class="btn">Edit</button>
        <button class="btn">Clear</button>
        <button class="btn pri">Parse</button>
      </div>
      <pre class="code">0200 723C000000000000 16 4111111111111111 000000012345</pre>
    </div>
    <div class="pane">
      <div class="hd"><b>Parse results</b><div class="sp"></div><button class="btn">Export</button></div>
      <div class="bar">ISO 8583 Standard · <u>parse-spec (binary)</u> · 48 / 64 bytes</div>
      <div class="issues">◀ 1 / 3 ▶ &nbsp; TRACK2.LEN is not a decimal number</div>
      <div class="scroll">
        <table class="g">
          <thead><tr><th>Field</th><th>Type</th><th>Len</th><th>Value</th></tr></thead>
          <tbody>
            <tr><td>MTI</td><td>PIC X(4)</td><td>4</td><td>0200</td></tr>
            <tr><td>BMP</td><td>BINARY 64</td><td>8</td><td>723C0000…</td></tr>
            <tr><td>PAN</td><td>LLVAR</td><td>16</td><td>4111111111111111</td></tr>
            <tr class="bad"><td>TRACK2.LEN</td><td>PIC X(2)</td><td>2</td><td>not a decimal number</td></tr>
            <tr><td>AMOUNT</td><td>PIC 9(12)</td><td>12</td><td>000000012345</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="pane">
      <div class="hd"><b>Raw message</b></div>
      <div class="hex">0000  <em>30 32 30 30</em>  72 3C 00 00  00 00 00 00  16 41 11 11
0010  11 11 11 11  11 11 11 11  00 00 00 00  00 01 23 45</div>
    </div>
  </div>
`,

settings: () => `
  <div class="top">
    <div class="brand"><strong>Settings</strong><em>Data detection is the first page</em></div>
    <div class="sp"></div>
    <button class="ico" onclick="show('first')">✕</button>
  </div>
  <div class="set">
    <div class="nav">
      <button class="on" data-tab="data">Data detection</button>
      <button data-tab="look">Appearance</button>
      <button data-tab="help">Help</button>
    </div>
    <div class="set-main" id="setBody">${tab('data')}</div>
  </div>
`,

editor: () => `
  <div class="top">
    <div class="brand"><strong>Data Editor</strong><em>PSTM</em></div>
    <div class="sp"></div>
    <button class="btn ghost">Cancel</button>
    <button class="btn pri">Save</button>
    <button class="ico" onclick="show('first')">✕</button>
  </div>
  <div class="de">
    <div class="col">
      <div class="hd"><b>Entities</b></div>
      <div class="scroll" style="padding:8px">
        <div class="grp">Messages</div>
        <div class="ent">ISO 8583 Standard</div>
        <div class="ent on">PSTM<span class="why">no DDL bound</span></div>
        <div class="ent">Base24 POS<span class="why">no parse spec</span></div>
        <div class="ent">NDC<span class="why">no recognizer</span></div>
        <div class="grp">Files</div>
        <div class="ent">Segmented File<span class="why">no DDL bound</span></div>
      </div>
    </div>
    <div class="col scroll">
      <div class="sec">
        <h3>Identity</h3>
        <div class="ids">
          <div class="fld"><label>Type</label><span>PSTM</span></div>
          <div class="fld"><label>Label</label><span>PSTM</span></div>
          <div class="fld"><label>Volume</label><span>POS</span></div>
          <div class="fld"><label>Color</label><span><i class="sw"></i>teal</span></div>
        </div>
      </div>
      <div class="sec">
        <h3>Recognizers</h3>
        <div class="rr"><span class="tag">literal</span><span>offset 0 · encoding ascii · value PSTM</span><button class="btn ghost">✕</button></div>
        <div class="rr"><span class="tag">min-length</span><span>40 bytes</span><button class="btn ghost">✕</button></div>
        <button class="btn" style="margin-top:4px">+ Recognizer</button>
      </div>
      <div class="sec">
        <h3>DDL binding</h3>
        <div class="gap">Nothing bound. Detection can name this PSTM, but the engine has no fields to walk.<br><strong>Bind POS / SV / PSTM / PSTM</strong></div>
      </div>
      <div class="sec">
        <h3>Parse spec · binary</h3>
        <div class="cm">
          <div class="ln"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div>
          <div class="src">{
  <span class="c-kw">"read-ddl"</span>: { <span class="c-kw">"until"</span>: <span class="c-num">"NUM-SERVICES"</span> },
  <span class="c-kw">"repeat"</span>: {
    <span class="c-kw">"count"</span>: <span class="c-num">"NUM-SERVICES"</span>,
    <span class="c-kw">"body"</span>: [{ <span class="c-kw">"read"</span>: <span class="c-num">"SRVCS"</span> }]
  }
}</div>
        </div>
      </div>
      <div class="sec">
        <h3>Overrides</h3>
        <table class="g">
          <thead><tr><th>Field</th><th>DE</th><th>Type</th><th>VLG</th></tr></thead>
          <tbody>
            <tr><td>HDR.NUM-SERVICES</td><td>—</td><td>uint16-be</td><td></td></tr>
            <tr><td>SRVCS</td><td>—</td><td></td><td></td></tr>
            <tr><td>EMV.DATA</td><td>—</td><td></td><td>on</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="col ed">
      <div class="hd"><b>Test</b><div class="sp"></div><button class="btn pri">Run</button></div>
      <div class="scroll">
        <table class="g">
          <thead><tr><th>Field</th><th>Value</th></tr></thead>
          <tbody>
            <tr><td>HDR.NUM-SERVICES</td><td>5</td></tr>
            <tr><td>SRVCS</td><td>AB</td></tr>
            <tr><td>SRVCS</td><td>CD</td></tr>
            <tr><td>SRVCS</td><td>EF</td></tr>
          </tbody>
        </table>
      </div>
      <div class="in">48 44 52 … sample bytes. Results stay in this column.</div>
    </div>
  </div>
`
};

function tab(which) {
  if (which === 'look') return `
    <h2>Appearance</h2>
    <p class="lead">Theme and density only. Parsing configuration is not here.</p>
    <div class="pref"><span>Theme</span><div class="seg"><i class="on">Dark</i><i>Light</i></div></div>
    <div class="pref"><span>Type size</span><div class="seg"><i>S</i><i class="on">M</i><i>L</i></div></div>
    <div class="pref"><span>Density</span><div class="seg"><i class="on">Comfort</i><i>Compact</i></div></div>`;
  if (which === 'help') return `
    <h2>Help</h2>
    <p class="lead">The manual lives here — not inside the empty Parse Results panel.</p>
    <div class="pref"><span>Getting started</span><button class="btn">Open</button></div>
    <div class="pref"><span>Parse-spec blocks</span><button class="btn">Open</button></div>
    <div class="pref"><span>Licence</span><button class="btn">Open</button></div>`;
  return `
    <h2>Data detection</h2>
    <p class="lead">Incomplete types are sentences. Click one to open it in the Data Editor.</p>
    <div class="card" onclick="show('editor')"><b>ISO 8583 Standard</b><span class="ok">ready</span></div>
    <div class="card" onclick="show('editor')"><b>PSTM</b><span class="no">no DDL bound</span></div>
    <div class="card" onclick="show('editor')"><b>Base24 POS</b><span class="no">no parse spec</span></div>
    <div class="card" onclick="show('editor')"><b>NDC</b><span class="no">no recognizer</span></div>`;
}

function show(name) {
  document.getElementById('app').innerHTML = scenes[name]();
  document.querySelectorAll('.scenes button').forEach(b => b.classList.toggle('on', b.dataset.scene === name));
  if (name === 'settings') {
    document.querySelectorAll('.nav button').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('.nav button').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        document.getElementById('setBody').innerHTML = tab(b.dataset.tab);
      };
    });
  }
}
document.querySelectorAll('.scenes button').forEach(b => b.addEventListener('click', () => show(b.dataset.scene)));
show('editor');
</script>
</body>
</html>
