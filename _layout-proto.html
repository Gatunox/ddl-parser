<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDL Parser — layout prototype</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #12151a;
    --raised: #1a1e25;
    --sunken: #0e1014;
    --line: rgba(255,255,255,.08);
    --line-strong: rgba(255,255,255,.14);
    --text: #e8edf2;
    --muted: #8b95a3;
    --faint: #5c6673;
    --accent: #3d8bfd;
    --accent-dim: rgba(61,139,253,.14);
    --ok: #3dd68c;
    --warn: #e3b341;
    --warn-dim: rgba(227,179,65,.12);
    --err: #f07178;
    --err-dim: rgba(240,113,120,.12);
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── chrome ── */
  .stage-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: #0f1216;
    flex-shrink: 0;
  }
  .stage-bar h1 {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .scenes { display: flex; gap: 4px; margin-left: 8px; }
  .scenes button, .note-toggle {
    font: inherit;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .scenes button.on, .scenes button:hover {
    color: var(--text);
    background: var(--raised);
    border-color: var(--line);
  }
  .note {
    margin-left: auto;
    color: var(--faint);
    font-size: 12px;
  }

  .app {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* ── title ── */
  .title {
    height: 40px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex-shrink: 0;
  }
  .wordmark { font-weight: 650; letter-spacing: -.02em; }
  .wordmark span { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 12px; }
  .spacer { flex: 1; }
  .icon-btn {
    width: 28px; height: 28px;
    border: 1px solid var(--line);
    background: var(--raised);
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    font: inherit;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--line-strong); }

  /* ── workspace ── */
  .workspace {
    flex: 1;
    min-height: 0;
    display: grid;
    gap: 1px;
    background: var(--line);
    padding: 1px;
  }
  .workspace.first-run {
    grid-template-columns: 1.1fr 1fr;
    grid-template-rows: 1fr auto;
  }
  .workspace.parsed {
    grid-template-columns: 1.15fr .85fr;
    grid-template-rows: minmax(0, 1fr) minmax(0, 1.15fr);
  }
  .panel {
    background: var(--panel);
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .ph {
    height: 32px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    border-bottom: 1px solid var(--line);
    background: var(--raised);
    flex-shrink: 0;
  }
  .ph b { font-size: 12px; font-weight: 600; }
  .ph .grow { flex: 1; }
  .ghost {
    font: inherit;
    font-size: 11px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 3px 8px;
    cursor: pointer;
  }
  .ghost:hover { color: var(--text); }
  .ghost.primary {
    background: var(--accent);
    border-color: transparent;
    color: #fff;
    font-weight: 600;
  }
  .ghost.warn {
    color: var(--warn);
    border-color: rgba(227,179,65,.35);
    background: var(--warn-dim);
  }
  .search {
    width: 140px;
    height: 22px;
    border: 1px solid var(--line);
    background: var(--sunken);
    color: var(--muted);
    border-radius: 5px;
    padding: 0 8px;
    font: 11px var(--sans);
  }

  .body { flex: 1; min-height: 0; overflow: auto; }
  .split { display: flex; flex: 1; min-height: 0; }
  .tree {
    width: 168px;
    border-right: 1px solid var(--line);
    padding: 8px;
    color: var(--muted);
    font-size: 12px;
  }
  .tree .vol { padding: 4px 6px; border-radius: 4px; }
  .tree .vol.on { background: var(--accent-dim); color: var(--text); }
  .editor, .msg {
    flex: 1;
    padding: 12px 14px;
    font: 12px/1.55 var(--mono);
    color: var(--faint);
    white-space: pre-wrap;
  }
  .msg.ready { color: var(--muted); }

  /* first-run footer */
  .launch {
    grid-column: 1 / -1;
    background: var(--panel);
    padding: 14px 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .launch-lead {
    font-size: 14px;
    font-weight: 550;
  }
  .launch-lead em { font-style: normal; color: var(--accent); }
  .gaps { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--warn-dim);
    border: 1px solid rgba(227,179,65,.28);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
  }
  .chip i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn); display: inline-block;
  }
  .chip:hover { border-color: var(--warn); }

  /* results */
  .errbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    background: var(--err-dim);
    border-bottom: 1px solid rgba(240,113,120,.25);
    color: var(--err);
    font-size: 12px;
    flex-shrink: 0;
  }
  .errbar .nav { color: var(--muted); }
  table.fields {
    width: 100%;
    border-collapse: collapse;
    font: 12px var(--mono);
  }
  table.fields th {
    text-align: left;
    font: 10px/1 var(--sans);
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  table.fields td {
    padding: 6px 10px;
    border-bottom: 1px solid var(--line);
    color: var(--text);
  }
  table.fields tr.err td { background: var(--err-dim); color: var(--err); }
  table.fields tr:hover td { background: rgba(255,255,255,.03); }
  .meta {
    padding: 6px 10px;
    font-size: 11px;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    background: var(--sunken);
  }
  .hex {
    padding: 12px;
    font: 11px/1.7 var(--mono);
    color: var(--muted);
  }
  .hex b { color: var(--accent); font-weight: 600; }

  /* settings */
  .settings {
    flex: 1;
    display: grid;
    grid-template-columns: 200px 1fr;
    min-height: 0;
    background: var(--line);
    gap: 1px;
    padding: 1px;
  }
  .nav {
    background: var(--panel);
    padding: 12px 8px;
  }
  .nav button {
    width: 100%;
    text-align: left;
    font: inherit;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 6px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .nav button.on { background: var(--accent-dim); color: var(--text); }
  .set-body { background: var(--panel); padding: 22px 28px; overflow: auto; }
  .set-body h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
  .set-body p.lead { margin: 0 0 20px; color: var(--muted); max-width: 52ch; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    max-width: 520px;
  }
  .seg { display: flex; background: var(--sunken); border-radius: 6px; padding: 2px; gap: 2px; }
  .seg span {
    padding: 4px 10px;
    border-radius: 5px;
    color: var(--muted);
    font-size: 12px;
  }
  .seg span.on { background: var(--raised); color: var(--text); }
  .spec {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 8px;
    max-width: 640px;
    cursor: pointer;
  }
  .spec:hover { border-color: var(--line-strong); }
  .spec .why { color: var(--warn); font-size: 12px; }
  .spec .ok { color: var(--ok); font-size: 12px; }
  .spec .name { font-weight: 600; min-width: 160px; }

  /* data editor */
  .de {
    flex: 1;
    display: grid;
    grid-template-columns: 200px minmax(0, 1.35fr) minmax(280px, .9fr);
    min-height: 0;
    background: var(--line);
    gap: 1px;
    padding: 1px;
  }
  .de-side, .de-main, .de-test {
    background: var(--panel);
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .de-main { overflow: auto; }
  .block { border-bottom: 1px solid var(--line); padding: 12px 14px; }
  .block h3 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .id-grid {
    display: grid;
    grid-template-columns: 70px 1fr 90px 70px;
    gap: 8px;
  }
  .fld {
    background: var(--sunken);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 6px 8px;
    color: var(--text);
    font: 12px var(--mono);
  }
  .fld label {
    display: block;
    font: 10px var(--sans);
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 3px;
  }
  .rec-row, .bind-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    font: 12px var(--mono);
    color: var(--muted);
  }
  .pill {
    font: 10px var(--sans);
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--accent-dim);
    color: var(--accent);
  }
  .missing {
    border: 1px dashed rgba(227,179,65,.45);
    background: var(--warn-dim);
    color: var(--warn);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
  }
  .de-side { padding: 0; }
  .ent {
    padding: 7px 8px;
    border-radius: 6px;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
  }
  .ent.on { background: var(--accent-dim); color: var(--text); }
  .ent .why { display: block; color: var(--warn); font-size: 11px; margin-top: 2px; }
  .code {
    flex: 1;
    padding: 14px;
    font: 12px/1.6 var(--mono);
    color: #c6d0dc;
    overflow: auto;
  }
  .kw { color: #7eb6ff; }
  .str { color: #9ece6a; }
  .test-out {
    flex: 1;
    overflow: auto;
  }
  .test-in {
    border-top: 1px solid var(--line);
    height: 88px;
    padding: 10px 12px;
    font: 12px var(--mono);
    color: var(--muted);
    background: var(--sunken);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="stage-bar">
  <h1>Layout prototype</h1>
  <div class="scenes">
    <button class="on" data-scene="first">First run</button>
    <button data-scene="parsed">After parse</button>
    <button data-scene="settings">Settings</button>
    <button data-scene="editor">Data Editor</button>
  </div>
  <div class="note">Not wired to the app — click the scenes. Style is a proposal, not a restyle of production.</div>
</div>

<div class="app" id="app"></div>

<script>
const scenes = {
  first: () => `
    <div class="title">
      <div class="wordmark">DDL Parser <span>NonStop / Base24 / ISO 8583</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" title="Settings" onclick="show('settings')">⚙</button>
    </div>
    <div class="workspace first-run">
      <div class="panel">
        <div class="ph">
          <b>DDL</b>
          <input class="search" value="" placeholder="Filter tree" readonly>
          <input class="search" value="" placeholder="Find in DDL" readonly>
          <div class="grow"></div>
          <button class="ghost">Save</button>
          <button class="ghost">Doc</button>
        </div>
        <div class="split">
          <div class="tree">
            <div class="vol">ATM</div>
            <div class="vol">BASE</div>
            <div class="vol">FILES</div>
            <div class="vol">POS</div>
            <div class="vol on">SWITCH · 1</div>
          </div>
          <div class="editor">DEF ISO-8583.
  02 MTI        PIC X(4).
  02 PRI-BIT-MAP PIC X(16).
  02 PAN        PIC X(19).
END.</div>
        </div>
      </div>
      <div class="panel">
        <div class="ph">
          <b>Message</b>
          <div class="grow"></div>
          <button class="ghost">Audit</button>
          <button class="ghost primary" onclick="show('parsed')">Parse</button>
        </div>
        <div class="msg">Paste a capture — hex, NETARD, FUP COPY, or ASCII.

Parse stays available. The field does not lock; use Clear if you want a blank slate.</div>
      </div>
      <div class="launch">
        <div class="launch-lead">Paste a message, then <em>Parse</em>. Detection picks the type. If a type is incomplete, fix it here — you do not need to load a DDL first.</div>
        <div class="gaps">
          <button class="chip" onclick="show('editor')"><i></i> PSTM — no DDL bound</button>
          <button class="chip" onclick="show('editor')"><i></i> Base24 POS — no parse spec</button>
          <button class="chip" onclick="show('editor')"><i></i> NDC — no recognizer</button>
        </div>
      </div>
    </div>
  `,

  parsed: () => `
    <div class="title">
      <div class="wordmark">DDL Parser <span>NonStop / Base24 / ISO 8583</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" onclick="show('settings')">⚙</button>
    </div>
    <div class="workspace parsed">
      <div class="panel">
        <div class="ph">
          <b>DDL</b>
          <input class="search" placeholder="Filter tree" readonly>
          <div class="grow"></div>
          <button class="ghost">Doc</button>
        </div>
        <div class="split">
          <div class="tree">
            <div class="vol on">SWITCH · ISO</div>
            <div class="vol">POS</div>
          </div>
          <div class="editor">DEF ISO-8583.
  02 MTI PIC X(4).
  02 BMP PIC X(16).
  …</div>
        </div>
      </div>
      <div class="panel">
        <div class="ph">
          <b>Message</b>
          <div class="grow"></div>
          <button class="ghost">Edit</button>
          <button class="ghost">Clear</button>
          <button class="ghost primary">Parse</button>
        </div>
        <div class="msg ready">0200 723C000000000000 16 4111111111111111 000000012345 …</div>
      </div>
      <div class="panel">
        <div class="ph">
          <b>Parse results</b>
          <div class="grow"></div>
          <button class="ghost">Export</button>
        </div>
        <div class="meta">ISO 8583 Standard · parse-spec (binary) · 48 / 64 bytes · 3 issues</div>
        <div class="errbar">
          <span class="nav">◀ 1 / 3 ▶</span>
          TRACK2.LEN is not a decimal number — jump goes to the row
        </div>
        <div class="body">
          <table class="fields">
            <thead><tr><th>Field</th><th>Type</th><th>Len</th><th>Value</th></tr></thead>
            <tbody>
              <tr><td>MTI</td><td>PIC X(4)</td><td>4</td><td>0200</td></tr>
              <tr><td>BMP</td><td>BINARY 64</td><td>8</td><td>723C0000…</td></tr>
              <tr><td>PAN</td><td>LLVAR</td><td>16</td><td>4111111111111111</td></tr>
              <tr class="err"><td>TRACK2.LEN</td><td>PIC X(2)</td><td>2</td><td>not a decimal number</td></tr>
              <tr><td>AMOUNT</td><td>PIC 9(12)</td><td>12</td><td>000000012345</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <div class="ph"><b>Raw message</b></div>
        <div class="hex">0000  <b>30 32 30 30</b>  72 3C 00 00  00 00 00 00  16 41 11 11
0010  11 11 11 11  11 11 11 11  00 00 00 00  00 01 23 45</div>
      </div>
    </div>
  `,

  settings: () => `
    <div class="title">
      <div class="wordmark">DDL Parser <span>Settings</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" onclick="show('first')">✕</button>
    </div>
    <div class="settings">
      <div class="nav">
        <button class="on" data-tab="data">Data detection</button>
        <button data-tab="look">Appearance</button>
        <button data-tab="help">Help</button>
      </div>
      <div class="set-body" id="setBody">${settingsTab('data')}</div>
    </div>
  `,

  editor: () => `
    <div class="title">
      <div class="wordmark">Data Editor <span>PSTM</span></div>
      <div class="spacer"></div>
      <button class="ghost">Cancel</button>
      <button class="ghost primary">Save</button>
      <button class="icon-btn" onclick="show('first')">✕</button>
    </div>
    <div class="de">
      <div class="de-side">
        <div class="ph"><b>Entities</b></div>
        <div class="body" style="padding:8px">
          <div class="ent">ISO 8583 Standard</div>
          <div class="ent on">PSTM
            <span class="why">no DDL bound</span>
          </div>
          <div class="ent">Base24 POS
            <span class="why">no parse spec</span>
          </div>
          <div class="ent">NDC
            <span class="why">no recognizer</span>
          </div>
        </div>
      </div>
      <div class="de-main">
        <div class="block">
          <h3>Identity</h3>
          <div class="id-grid">
            <div class="fld"><label>Type</label>PSTM</div>
            <div class="fld"><label>Label</label>PSTM</div>
            <div class="fld"><label>Volume</label>POS</div>
            <div class="fld"><label>Color</label>■ teal</div>
          </div>
        </div>
        <div class="block">
          <h3>Recognizers</h3>
          <div class="rec-row"><span class="pill">literal</span> offset 0 · value <span style="color:var(--text)">PSTM</span></div>
          <div class="rec-row"><span class="pill">min-length</span> 40 bytes</div>
          <button class="ghost" style="margin-top:6px">+ New</button>
        </div>
        <div class="block">
          <h3>DDL binding</h3>
          <div class="missing">Nothing bound — Parse can detect PSTM but cannot walk fields until you pick a DDL. Click to bind POS/SV/PSTM/PSTM.</div>
        </div>
        <div class="block">
          <h3>Parse spec · Binary</h3>
          <div class="code" style="padding:0;min-height:120px">{
  <span class="kw">"read-ddl"</span>: { <span class="kw">"until"</span>: <span class="str">"NUM-SERVICES"</span> },
  <span class="kw">"repeat"</span>: {
    <span class="kw">"count"</span>: <span class="str">"NUM-SERVICES"</span>,
    <span class="kw">"body"</span>: [{ <span class="kw">"read"</span>: <span class="str">"SRVCS"</span> }]
  },
  <span class="kw">"token-area"</span>: <span class="str">"ANY"</span>
}</div>
        </div>
        <div class="block">
          <h3>Overrides</h3>
          <table class="fields">
            <thead><tr><th>Field</th><th>DE</th><th>Type</th><th>VLG</th></tr></thead>
            <tbody>
              <tr><td>HDR.NUM-SERVICES</td><td>—</td><td>uint16-be</td><td></td></tr>
              <tr><td>SRVCS</td><td>—</td><td></td><td></td></tr>
              <tr><td>EMV.DATA</td><td>—</td><td></td><td>on</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="de-test">
        <div class="ph">
          <b>Test</b>
          <div class="grow"></div>
          <button class="ghost primary">Run</button>
        </div>
        <div class="test-out">
          <table class="fields">
            <thead><tr><th>Field</th><th>Value</th></tr></thead>
            <tbody>
              <tr><td>HDR.NUM-SERVICES</td><td>5</td></tr>
              <tr><td>SRVCS</td><td>AB</td></tr>
              <tr><td>SRVCS</td><td>CD</td></tr>
              <tr><td>SRVCS</td><td>EF</td></tr>
            </tbody>
          </table>
        </div>
        <div class="test-in">Sample bytes stay here. Test is a column, not a collapsed bar under Overrides.</div>
      </div>
    </div>
  `
};

function settingsTab(which) {
  if (which === 'look') return `
    <h2>Appearance</h2>
    <p class="lead">Theme, type size, density. Nothing about parsing lives here.</p>
    <div class="row"><span>Theme</span><div class="seg"><span class="on">Dark</span><span>Light</span></div></div>
    <div class="row"><span>Type size</span><div class="seg"><span>S</span><span class="on">M</span><span>L</span></div></div>
    <div class="row"><span>Density</span><div class="seg"><span class="on">Comfort</span><span>Compact</span></div></div>
  `;
  if (which === 'help') return `
    <h2>Help</h2>
    <p class="lead">The manual is here, not pasted into the empty Parse Results panel.</p>
    <div class="row"><span>Getting started</span><span class="ghost">Open</span></div>
    <div class="row"><span>Parse spec blocks</span><span class="ghost">Open</span></div>
    <div class="row"><span>Licence</span><span class="ghost">Open</span></div>
  `;
  return `
    <h2>Data detection</h2>
    <p class="lead">This is the first settings page. Incomplete types are sentences you can click — not a hover-only badge.</p>
    <div class="spec" onclick="show('editor')"><span class="name">ISO 8583 Standard</span><span class="ok">ready</span></div>
    <div class="spec" onclick="show('editor')"><span class="name">PSTM</span><span class="why">no DDL bound</span></div>
    <div class="spec" onclick="show('editor')"><span class="name">Base24 POS</span><span class="why">no parse spec</span></div>
    <div class="spec" onclick="show('editor')"><span class="name">NDC</span><span class="why">no recognizer</span></div>
  `;
}

function show(name) {
  document.getElementById('app').innerHTML = scenes[name]();
  document.querySelectorAll('.scenes button').forEach(b => {
    b.classList.toggle('on', b.dataset.scene === name);
  });
  if (name === 'settings') {
    document.querySelectorAll('.nav button').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('.nav button').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        document.getElementById('setBody').innerHTML = settingsTab(b.dataset.tab);
      };
    });
  }
}

document.querySelectorAll('.scenes button').forEach(b => {
  b.addEventListener('click', () => show(b.dataset.scene));
});
show('first');
</script>
</body>
</html>
